services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚠ RabbitMQ is gone. ADMET jobs live in the `admet_jobs` collection in Mongo — see
  # server/utils/admetQueue.js and docs/BOX-ARCHITECTURE.md §5. This service still passed
  # RABBITMQ_URL / ADMET_QUEUE_NAME / API_BASE_URL, none of which the worker reads any more,
  # and depended on a broker that no longer belongs here. It would not have failed with a
  # clear configuration error; it would have crash-looped on a missing MONGODB_URI.
  admet-worker:
    profiles: ["workers"]
    build:
      context: ./services/admet
      # The default target is the CUDA image, which is x86_64-only and needs a GPU. Local
      # development gets the wrapper, with the deterministic stub predictor.
      target: test
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/medsaas}
      ADMET_CALLBACK_URL: ${BASE_URL:-http://host.docker.internal:3000}
      ADMET_CALLBACK_SECRET: ${ADMET_CALLBACK_SECRET:-}
      ADMET_ENGINE: ${ADMET_ENGINE:-stub}
    command: ["python", "-m", "admet_worker"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  gromacs-api:
    profiles: ["science"]
    build: ./services/gromacs-api
    ports:
      - "8001:8000"
    volumes:
      - gromacs-data:/data
    environment:
      WORK_DIR: /data
      MAX_UPLOAD_SIZE: 104857600
      JOB_TIMEOUT: 3600
    restart: unless-stopped

  glioblastoma-predictor:
    profiles: ["science"]
    build: ./services/glioblastoma-predictor
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-server:
    profiles: ["mcp"]
    build: ./services/mcp-server
    ports:
      - "8080:8080"
    environment:
      MEDSAAS_API_BASE: ${BASE_URL:-http://host.docker.internal:3000}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
    restart: unless-stopped

volumes:
  mongo-data:
  gromacs-data:
