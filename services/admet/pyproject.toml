[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxis-admet-worker"
version = "2026.7.30"
description = "ADMET prediction worker — polls admet_jobs in MongoDB"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["admet_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
