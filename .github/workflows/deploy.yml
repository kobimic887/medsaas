name: Build & Deploy (non-prod)

on:
  # Manual-only for now: run from the Actions tab via "Run workflow".
  # Uncomment to auto-deploy on every push to main.
  # push:
  #   branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-nonprod
  cancel-in-progress: true

jobs:
  # Gate: run the full check + test suite (ci.yml) before anything ships. A
  # broken commit can no longer reach the box without tests passing first.
  # This is a separate job, not a step in `deploy` — the deploy job stays a
  # pure build-on-box flow with no runner-side build.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: non-prod
    steps:
      - uses: actions/checkout@v7

      # Build natively on the box (Oracle Ampere / arm64) — no registry, no
      # QEMU. Ship a clean source archive (tracked files only) over native
      # ssh/scp, then docker compose up --build on the box.
      #
      # The app image is built ON THE BOX from the root Dockerfile (oven/bun
      # base, two-stage Bun build). All package resolution happens inside the
      # on-box image build, not on this runner — no runner-side Bun or Node
      # build step is needed here. To preserve this: do NOT add any oven/bun
      # runner action or runner-side build step to this job.
      - name: Deploy to box
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_HOST, and DEPLOY_USER secrets must be set"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"

          git archive --format=tar.gz -o src.tar.gz HEAD
          ssh $SSHOPTS "$SSH_USER@$HOST" 'mkdir -p ~/medsaas'
          scp $SSHOPTS src.tar.gz "$SSH_USER@$HOST:~/medsaas/src.tar.gz"
          ssh $SSHOPTS "$SSH_USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/medsaas
          rm -rf src && mkdir -p src
          tar -xzf src.tar.gz -C src
          cp src/docker-compose.box.yml docker-compose.box.yml
          rm -f src.tar.gz

          if [ ! -f .env ]; then
            echo "ERROR: ~/medsaas/.env is missing on the deploy host"
            exit 1
          fi

          docker compose -f docker-compose.box.yml config --quiet
          docker compose -f docker-compose.box.yml up -d --build

          for attempt in $(seq 1 20); do
            if docker compose -f docker-compose.box.yml exec -T app bun --eval "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1);"; then
              docker image prune -f
              exit 0
            fi
            echo "Waiting for app health check ($attempt/20)..."
            sleep 3
          done

          docker compose -f docker-compose.box.yml ps
          docker compose -f docker-compose.box.yml logs --no-color --tail=120 app
          exit 1
          REMOTE
