name: CI

# Check + test gate. Runs on every push/PR to main for developer feedback, and
# is reused by deploy.yml (workflow_call) so a deploy cannot proceed unless both
# the default Bun runtime and the Node fallback pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Separate push/PR runs from deploy-gate (workflow_call) runs on the same ref
  # so a push-triggered CI can never cancel the deploy job's required test run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check + tests (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # mongodb-memory-server downloads a real mongod binary on first run.
      # ubuntu-latest is 24.04, which MongoDB 7.0 has no published build for —
      # force the ubuntu-22.04 binary (runs fine on 24.04) and cache it so the
      # suite isn't at the mercy of the download on every run.
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve bun path for the test harness
        # The server-boot tests spawn index.js via $BUN_PATH (it otherwise
        # defaults to ~/.bun/bin/bun). Point it at the bun installed above.
        run: echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: bun run install:all

      - name: Check + tests
        # bun run ci == bun run check (server syntax + client build) && bun run test
        run: bun run ci

  test-node:
    name: check + tests (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm run install:all:node

      - name: Check + tests
        run: npm run ci:node
