name: CI

# Check + test gate. Runs on every push/PR to main for developer feedback, and
# is reused by deploy.yml (workflow_call) so a deploy cannot proceed unless both
# the default Bun runtime and the Node fallback pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Separate push/PR runs from deploy-gate (workflow_call) runs on the same ref
  # so a push-triggered CI can never cancel the deploy job's required test run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check + tests (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # mongodb-memory-server downloads a real mongod binary on first run.
      # ubuntu-latest is 24.04, which MongoDB 7.0 has no published build for —
      # force the ubuntu-22.04 binary (runs fine on 24.04) and cache it so the
      # suite isn't at the mercy of the download on every run.
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve bun path for the test harness
        # The server-boot tests spawn index.js via $BUN_PATH (it otherwise
        # defaults to ~/.bun/bin/bun). Point it at the bun installed above.
        run: echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: bun run install:all

      - name: Check + tests
        # bun run ci == bun run check (server syntax + client build) && bun run test
        run: bun run ci

  test-node:
    name: check + tests (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm run install:all:node

      - name: Check + tests
        run: npm run ci:node

  box-services:
    # The compute services that move to the Amsterdam box. Both are qualified for
    # linux/amd64 only and both need a Docker daemon, so this is the only place they
    # can be exercised before the hardware exists:
    #
    #   - the dev Macs are arm64 and have no Docker;
    #   - 83 has Docker but 2 GB of RAM, no swap and 8.6 GB free, and is production
    #     shared with an unrelated tenant. rdkit + openmm + vina would OOM pip or fill
    #     the disk, and a full disk on 83 is an outage.
    #
    # An ubuntu-latest runner is the right architecture, is free, and risks nothing.
    # Deliberately NOT wired into deploy.yml's gate: deploy.yml ships the API, and
    # these are compute services with a separate lifecycle.
    name: box compute services (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: convertSTR — container suite, offline
        run: |
          docker build --platform linux/amd64 --target test \
            --tag pyxis-convertstr:test deploy/box/convertstr
          docker run --rm --platform linux/amd64 \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            pyxis-convertstr:test

      - name: docking — container suite, HTTP replay, and the immutable verifier
        # test.sh builds both targets, runs the replay suite with --network none,
        # stands the service on an internal-only network, and checks a real dock
        # against the committed 1cx7 baseline using scripts/verify-docking-response.mjs.
        # RUN_VINA stays unset: that suite downloads from RCSB and runs CPU Vina,
        # which would make CI depend on an external host.
        run: deploy/box/docking/service/test.sh
