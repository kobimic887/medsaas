name: CI

# Code changes run the Bun gate. Manual and reusable runs include the Node
# fallback and compute containers; documentation changes need no full build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      full_validation:
        description: Run the complete release gate when called by another workflow
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Reusable workflows inherit the caller's event name. Include the caller's
  # workflow name so a standalone CI run cannot cancel a deployment gate.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.select.outputs.app }}
      full: ${{ steps.select.outputs.full }}
      convertstr: ${{ steps.select.outputs.convertstr }}
      docking: ${{ steps.select.outputs.docking }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select checks from changed files
        id: select
        env:
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' || inputs.full_validation == true }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          full = os.environ['FULL_VALIDATION'] == 'true'
          files = []
          if not full:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              # New branches or missing history run everything conservatively.
              known_base = base and subprocess.run(
                  ['git', 'cat-file', '-e', f'{base}^{{commit}}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not known_base:
                  full = True
              else:
                  separator = '...' if os.environ['EVENT_NAME'] == 'pull_request' else '..'
                  changed = subprocess.check_output([
                      'git', 'diff', '--name-only', '--no-renames', '-z', f'{base}{separator}{head}', '--',
                  ]).decode().split('\0')
                  files = [p for p in changed if p and not (p.endswith('.md') or p.startswith('docs/'))]

          shared_compute = {'.github/workflows/ci.yml', 'deploy/box/compose.yml'}
          selected = {
              'full': full,
              'app': full or bool(files),
              'convertstr': full or any(p.startswith('deploy/box/convertstr/') or p in shared_compute for p in files),
              'docking': full or any(p.startswith('deploy/box/docking/') or p in shared_compute or p == 'scripts/verify-docking-response.mjs' for p in files),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, enabled in selected.items():
                  output.write(f'{name}={str(enabled).lower()}\n')
          print('Selected checks:', ', '.join(name for name, enabled in selected.items() if enabled) or 'documentation only')
          PY

  test:
    name: check + tests (bun)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # mongodb-memory-server downloads a real mongod binary on first run.
      # ubuntu-latest is 24.04, which MongoDB 7.0 has no published build for —
      # force the ubuntu-22.04 binary (runs fine on 24.04) and cache it so the
      # suite isn't at the mercy of the download on every run.
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve bun path for the test harness
        # The server-boot tests spawn index.js via $BUN_PATH (it otherwise
        # defaults to ~/.bun/bin/bun). Point it at the bun installed above.
        run: echo "BUN_PATH=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: bun run install:all

      - name: Check + tests
        # Build, lint, client contract checks, and the server suite once.
        run: bun run ci

  test-node:
    name: check + tests (node 24)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm run install:all:node

      - name: Check + tests
        run: npm run ci:node

  box-services:
    # These container suites require linux/amd64. Routine app changes do not
    # rebuild them; manual and reusable release gates include both services.
    name: box compute services (linux/amd64)
    needs: changes
    if: needs.changes.outputs.convertstr == 'true' || needs.changes.outputs.docking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: convertSTR — container suite, offline
        if: needs.changes.outputs.convertstr == 'true'
        run: |
          docker build --platform linux/amd64 --target test \
            --tag pyxis-convertstr:test deploy/box/convertstr
          docker run --rm --platform linux/amd64 \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            pyxis-convertstr:test

      - name: docking — container suite, HTTP replay, and the immutable verifier
        if: needs.changes.outputs.docking == 'true'
        # test.sh builds both targets, runs the replay suite with --network none,
        # stands the service on an internal-only network, and checks a real dock
        # against the committed 1cx7 baseline using scripts/verify-docking-response.mjs.
        # RUN_VINA stays unset: that suite downloads from RCSB and runs CPU Vina,
        # which would make CI depend on an external host.
        run: deploy/box/docking/service/test.sh
