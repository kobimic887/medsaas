# Isolated Pyxis staging routing — insert INSIDE the existing
# `server { listen 443 ...; server_name app.pyxis-discovery.com; }` block, next
# to the `location /` that proxies the production app to 127.0.0.1:5174.
#
# The trailing-slash proxy_pass strips the /staging prefix, so the staging
# server (built with Vite base /staging/ + React Router basename /staging) sees
# clean paths while the browser address bar keeps /staging/... intact. Any
# request under /staging/ — page, deep link, asset, or /staging/api/* — is
# answered by the loopback staging process only; nothing falls through to the
# production API.
#
# Procedure: copy the live site file to /root/pyxis-staging-nginx-backup.<ts>,
# insert these lines, then `nginx -t && systemctl reload nginx`.

    # /staging (no trailing slash) consistently redirects to /staging/.
    location = /staging {
        return 301 /staging/;
    }

    location /staging/ {
        proxy_pass http://127.0.0.1:5274/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
