# Non-secret staging-only systemd drop-in for pyxis-web-staging.service.
# This loopback listener is an SSH tunnel to the scientific data host.
# No RPX/VPX index artifacts belong on the application host.
# Keep this out of server/.env so updating the preview never touches JWT_SECRET.
[Service]
Environment=MACROCYCLE_SEARCH_BASE=http://127.0.0.1:18274
