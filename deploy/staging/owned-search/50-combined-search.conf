# Staging-only drop-in for pyxis-web-staging.service: both macrocycle search
# clients use the combined service through the existing 18276 tunnel. Overrides
# 10-macrocycle-search.conf and 30-owned-search.conf; delete it to roll back.
[Service]
Environment=MACROCYCLE_SEARCH_BASE=http://127.0.0.1:18276
Environment=OWNED_SEARCH_BASE=http://127.0.0.1:18276/graph
