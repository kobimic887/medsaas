# Include inside the existing app.pyxis-discovery.com HTTPS server block.
# Covers both production and /staging/ unless a location overrides it.
# Application inference is bounded at 600s, Home waits 660s. Allow the app to
# return its result/error and settle credits before nginx closes the socket.
# This is an inactivity timeout, not an extension of the application's budget.
proxy_read_timeout 650s;
