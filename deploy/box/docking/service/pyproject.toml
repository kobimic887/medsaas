[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxis-docking"
version = "0.1.0"
description = "Private docking compatibility service for the Pyxis compute box"
requires-python = "==3.11.10"
dependencies = [
  "fastapi==0.111.0",
  "gemmi==0.7.5",
  "httpx==0.28.1",
  "meeko==0.7.1",
  "openmm==8.2.0",
  "pdbfixer==1.12.0",
  "pydantic==2.11.0",
  "rdkit==2026.3.4",
  "scipy==1.17.1",
  "uvicorn==0.30.1",
  "vina==1.2.7",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
pyxis-docking = "docking_service.__main__:main"
pyxis-docking-cache = "docking_service.cache_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "vina: remote-only real CPU Vina/RCSB integration suite (requires network)",
]

[tool.setuptools]
packages = ["docking_service", "docking_service.engines"]
include-package-data = true

[tool.setuptools.package-data]
docking_service = ["assets/*.json", "assets/*.pdb"]
